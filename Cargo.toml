[package]
name = "VeeType"
version = "0.1.0"
edition = "2021"

[dependencies]
# Audio capture and buffering
cpal = "0.15.3"
ringbuf = "0.3.3"
anyhow = "1.0"

# Whisper AI bindings
whisper-rs = "0.16"

# Global keyboard state polling
device_query = "4.0"

# Keyboard stroke simulation (Non-clipboard text injection)
enigo = "0.1"

# Windows API access for active-window detection
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Security"] }

# System tray background daemon support
tray-icon = "0.26"

# Configuration parsing
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Local LLM processing engine
llama-cpp-2 = "0.1.158"
sysinfo = "0.39.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde_json = "1"
chrono = "0.4"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "ansi"] }
tracing-appender = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

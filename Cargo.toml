[package]
name = "VeeType"
version = "1.0.0"
edition = "2021"

[dependencies]
# Audio capture and buffering
cpal = "0.15.3"
ringbuf = "0.3.3"
anyhow = "1.0"

# Whisper AI bindings with optional cross-vendor Vulkan acceleration.
whisper-rs = "0.16"

keyring = "2"

# Windows API access for active-window detection
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell"] }

# System tray background daemon support
tray-icon = "0.26"

# Configuration parsing
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Local LLM processing engine
llama-cpp-2 = "0.1.158"
sysinfo = "0.39.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde_json = "1"
chrono = "0.4"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "ansi"] }
tracing-appender = "0.2"
webrtc-vad = "0.4"
self_update = { version = "0.41", default-features = false, features = ["archive-zip", "compression-zip-deflate", "rustls"] }
regex = "1.10"
image = { version = "0.24", default-features = false, features = ["ico"] }
base64 = "0.22"
ed25519-dalek = "2"

[features]
vulkan = ["llama-cpp-2/vulkan", "whisper-rs/vulkan"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

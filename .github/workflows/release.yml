name: Windows Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Windows packages
    # The release commit made below must not start a second patch release.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      VEETYPE_SUPABASE_URL: ${{ vars.VEETYPE_SUPABASE_URL }}
      VEETYPE_SUPABASE_ANON_KEY: ${{ vars.VEETYPE_SUPABASE_ANON_KEY }}
      VEETYPE_LICENSE_PUBLIC_KEY_B64: ${{ vars.VEETYPE_LICENSE_PUBLIC_KEY_B64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Calculate release version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "Could not read the package version from Cargo.toml"
          }
          $packageVersion = $match.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -ne $packageVersion) {
              throw "Release tag v$tagVersion must match Cargo.toml version $packageVersion"
            }
            "version=$packageVersion" >> $env:GITHUB_OUTPUT
            "publish=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if ($env:GITHUB_EVENT_NAME -ne "push") {
            "version=$packageVersion" >> $env:GITHUB_OUTPUT
            "publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $semver = [regex]::Match($packageVersion, '^(\d+)\.(\d+)\.(\d+)$')
          if (-not $semver.Success) {
            throw "Cargo.toml version $packageVersion is not a three-part release version"
          }
          $major = $semver.Groups[1].Value
          $minor = $semver.Groups[2].Value
          $patch = [int]$semver.Groups[3].Value
          do {
            $patch++
            $nextVersion = "$major.$minor.$patch"
            git rev-parse --verify --quiet "refs/tags/v$nextVersion" *> $null
            $tagExists = $LASTEXITCODE -eq 0
          } while ($tagExists)

          $manifest = [regex]::Replace($manifest, '(?m)^version\s*=\s*"[^"]+"', "version = `"$nextVersion`"", 1)
          Set-Content -Path Cargo.toml -Value $manifest -NoNewline -Encoding utf8

          $lock = Get-Content Cargo.lock -Raw
          $lock = $lock -replace '(?ms)(\[\[package\]\]\s+name = "VeeType"\s+version = ")[^"]+("\s)', "`${1}$nextVersion`${2}"
          Set-Content -Path Cargo.lock -Value $lock -NoNewline -Encoding utf8

          $installer = Get-Content setup.iss -Raw
          $installer = $installer -replace '(?m)^#define AppVersion "[^"]+"', "#define AppVersion `"$nextVersion`""
          Set-Content -Path setup.iss -Value $installer -NoNewline -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock setup.iss
          git commit -m "chore(release): v$nextVersion"
          git tag -a "v$nextVersion" -m "Release v$nextVersion"
          git push origin HEAD:main --follow-tags

          "version=$nextVersion" >> $env:GITHUB_OUTPUT
          "publish=true" >> $env:GITHUB_OUTPUT

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Configure desktop licensing
        shell: pwsh
        run: |
          $requiredSettings = @(
            "VEETYPE_SUPABASE_URL",
            "VEETYPE_SUPABASE_ANON_KEY",
            "VEETYPE_LICENSE_PUBLIC_KEY_B64"
          )
          $configuredSettings = @($requiredSettings | Where-Object {
            -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          $licensingUnavailableReason = $null
          if ($configuredSettings.Count -eq 0) {
            $licensingUnavailableReason = "Supabase licensing is not configured."
          } elseif ($configuredSettings.Count -ne $requiredSettings.Count) {
            $licensingUnavailableReason = "Supabase licensing settings are incomplete."
          } else {
            $supabaseUrl = $null
            if (-not [Uri]::TryCreate($env:VEETYPE_SUPABASE_URL, [UriKind]::Absolute, [ref]$supabaseUrl) -or
                $supabaseUrl.Scheme -ne "https") {
              $licensingUnavailableReason = "VEETYPE_SUPABASE_URL is not a valid HTTPS URL."
            } else {
              try {
                $publicKey = [Convert]::FromBase64String($env:VEETYPE_LICENSE_PUBLIC_KEY_B64)
                if ($publicKey.Length -ne 32) {
                  $licensingUnavailableReason = "VEETYPE_LICENSE_PUBLIC_KEY_B64 must decode to exactly 32 bytes."
                }
              } catch {
                $licensingUnavailableReason = "VEETYPE_LICENSE_PUBLIC_KEY_B64 is not valid base64."
              }
            }
          }
          if ($licensingUnavailableReason) {
            Write-Host "::warning::$licensingUnavailableReason Building with Pro sign-in and license verification disabled."
            foreach ($setting in $requiredSettings) {
              Add-Content -Path $env:GITHUB_ENV -Value "$setting="
            }
          }

      - name: Run Rust tests
        run: cargo test --locked

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $sdkVersion = "1.3.296.0"
          $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-Installer.exe"
          $downloadUrl = "https://sdk.lunarg.com/sdk/download/$sdkVersion/windows/VulkanSDK-$sdkVersion-Installer.exe"
          curl.exe --fail --location --retry 3 --retry-all-errors --output $installer $downloadUrl
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK download failed" }
          $process = Start-Process -FilePath $installer `
            -ArgumentList @("--accept-licenses", "--default-answer", "--confirm-command", "install") `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK installation failed with exit code $($process.ExitCode)" }
          $sdkPath = "C:\VulkanSDK\$sdkVersion"
          if (-not (Test-Path (Join-Path $sdkPath "Lib\vulkan-1.lib"))) {
            throw "Vulkan SDK library was not found under $sdkPath"
          }
          "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV

      - name: Check out SPIR-V headers
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: 2a9b6f951c7d6b04b6c21fe1bf3f475b68b84801
          path: deps/SPIRV-Headers

      - name: Install SPIR-V headers CMake package
        shell: pwsh
        run: |
          $prefix = "D:\spirv-headers"
          cmake -S deps\SPIRV-Headers -B "$env:RUNNER_TEMP\spirv-headers-build" `
            -DSPIRV_HEADERS_ENABLE_TESTS=OFF "-DCMAKE_INSTALL_PREFIX=$prefix"
          if ($LASTEXITCODE -ne 0) { throw "SPIRV-Headers CMake configuration failed" }
          cmake --install "$env:RUNNER_TEMP\spirv-headers-build" --config Release
          if ($LASTEXITCODE -ne 0) { throw "SPIRV-Headers installation failed" }
          $packageConfig = Join-Path $prefix "share\cmake\SPIRV-Headers\SPIRV-HeadersConfig.cmake"
          if (-not (Test-Path $packageConfig)) { throw "SPIRV-Headers CMake package was not installed" }

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Ninja installation failed" }
          }
          ninja --version
          if ($LASTEXITCODE -ne 0) { throw "Ninja is unavailable" }

      - name: Build Vulkan-enabled release
        run: cargo build --release --locked --features vulkan --target-dir D:\t --jobs 1
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
          CMAKE_PREFIX_PATH: D:\spirv-headers
          CMAKE_GENERATOR: Ninja

      - name: Package Vulkan OTA archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          Copy-Item D:\t\release\VeeType.exe target\release\VeeType.exe -Force
          Compress-Archive -Path target\release\VeeType.exe `
            -DestinationPath dist\VeeType-x86_64-pc-windows-msvc.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile unsigned installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not installed at $iscc" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" /DNoSign setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Stage installer release asset
        shell: pwsh
        run: |
          Copy-Item Output\VeeType_Installer_v*.exe dist\VeeType_Setup.exe

      - name: Upload build artifacts (manual runs)
        if: steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: veetype-windows
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VeeType-x86_64-pc-windows-msvc.zip
            dist/VeeType_Setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
